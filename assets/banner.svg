<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Bookmarks Folders Bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      .t  { font-family: 'Segoe UI', Ubuntu, system-ui, sans-serif; fill:#ffffff; }
      .sub{ font-family: 'Segoe UI', Ubuntu, system-ui, sans-serif; fill:#DDD6FE; }
      .lbl{ font-family: 'Segoe UI', Ubuntu, system-ui, sans-serif; fill:#EDE9FE; }
      .folder{ fill:#FBBF24; }
      .folderTab{ fill:#F59E0B; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- LEFT: tab sidebar mock -->
  <g filter="url(#soft)" transform="translate(70,70)">
    <rect width="150" height="200" rx="14" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="18" y="22" width="114" height="26" rx="7" fill="#ffffff" fill-opacity="0.14"/>
    <path class="folderTab" d="M28 30 h16 l4 5 h14 a4 4 0 0 1 4 4 v0 h-42 a4 4 0 0 1 -4 -4 z" transform="translate(0,0)"/>
    <rect x="18" y="66" width="114" height="26" rx="7" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="40" y="110" width="92" height="22" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="40" y="140" width="92" height="22" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <text class="lbl" x="75" y="192" font-size="13" text-anchor="middle" opacity="0.9">Pestañas</text>
  </g>

  <!-- bidirectional arrows -->
  <g transform="translate(250,170)">
    <path d="M0 -22 H150" stroke="#FDE68A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M150 -22 l-16 -9 v18 z" fill="#FDE68A"/>
    <path d="M150 22 H0" stroke="#C4B5FD" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 22 l16 -9 v18 z" fill="#C4B5FD"/>
  </g>

  <!-- RIGHT: bookmarks bar mock -->
  <g filter="url(#soft)" transform="translate(470,120)">
    <rect width="230" height="100" rx="14" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25"/>
    <g transform="translate(16,20)">
      <path class="folder" d="M0 8 h14 l4 5 h16 a4 4 0 0 1 4 4 v30 a4 4 0 0 1 -4 4 h-30 a4 4 0 0 1 -4 -4 z"/>
    </g>
    <g transform="translate(74,20)">
      <path class="folder" d="M0 8 h14 l4 5 h16 a4 4 0 0 1 4 4 v30 a4 4 0 0 1 -4 4 h-30 a4 4 0 0 1 -4 -4 z"/>
    </g>
    <g transform="translate(132,20)">
      <path class="folder" d="M0 8 h14 l4 5 h16 a4 4 0 0 1 4 4 v30 a4 4 0 0 1 -4 4 h-30 a4 4 0 0 1 -4 -4 z"/>
    </g>
    <text class="lbl" x="115" y="88" font-size="13" text-anchor="middle" opacity="0.9">Marcadores</text>
  </g>

  <!-- title block -->
  <text class="t"   x="770" y="150" font-size="46" font-weight="700">Bookmarks Folders Bridge</text>
  <text class="sub" x="772" y="192" font-size="21">Mueve carpetas entre la barra lateral y los</text>
  <text class="sub" x="772" y="220" font-size="21">marcadores de Zen — con toda su estructura.</text>
  <g transform="translate(772,244)">
    <rect width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="59" y="20" font-size="14" text-anchor="middle">Zen Browser</text>
    <rect x="130" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="165" y="20" font-size="14" text-anchor="middle">Sine</text>
    <rect x="210" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="250" y="20" font-size="14" text-anchor="middle">v1.0.0</text>
  </g>
</svg>
