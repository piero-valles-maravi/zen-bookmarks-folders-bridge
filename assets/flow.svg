<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Flujo bidireccional entre pestañas y marcadores">
  <defs>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.20"/>
    </filter>
    <style>
      .h  { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#ffffff; font-weight:700; }
      .row{ font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#ffffff; }
      .cap{ font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#4C1D95; font-weight:600; }
      .cap2{font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#92400E; font-weight:600; }
      .muted{font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#6B7280; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="20" fill="#ffffff"/>
  <rect x="0" y="0" width="960" height="440" rx="20" fill="#F5F3FF"/>

  <!-- LEFT card: tab folder -->
  <g filter="url(#sh)" transform="translate(60,110)">
    <rect width="300" height="250" rx="16" fill="url(#cardA)"/>
    <text class="h" x="24" y="42" font-size="20">Carpeta de pestañas</text>
    <text class="row" x="24" y="66" font-size="13" opacity="0.85">(barra lateral de Zen)</text>
    <g transform="translate(24,86)">
      <rect width="252" height="34" rx="8" fill="#ffffff" fill-opacity="0.16"/>
      <path d="M14 12 h12 l4 4 h12 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-25 a3 3 0 0 1 -3 -3 z" fill="#FDE68A"/>
      <text class="row" x="56" y="22" font-size="14">Trabajo</text>
    </g>
    <g transform="translate(48,128)">
      <rect width="228" height="30" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <path d="M12 10 h10 l3 3 h10 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-20 a3 3 0 0 1 -3 -3 z" fill="#FCD34D"/>
      <text class="row" x="46" y="20" font-size="13">Proyectos</text>
    </g>
    <g transform="translate(72,164)">
      <rect width="204" height="26" rx="7" fill="#ffffff" fill-opacity="0.10"/>
      <circle cx="18" cy="13" r="5" fill="#A7F3D0"/>
      <text class="row" x="34" y="18" font-size="12">pestaña.com</text>
    </g>
    <g transform="translate(48,198)">
      <rect width="228" height="26" rx="7" fill="#ffffff" fill-opacity="0.10"/>
      <circle cx="18" cy="13" r="5" fill="#A7F3D0"/>
      <text class="row" x="34" y="18" font-size="12">otra-pestaña.com</text>
    </g>
  </g>

  <!-- RIGHT card: bookmark folder -->
  <g filter="url(#sh)" transform="translate(600,110)">
    <rect width="300" height="250" rx="16" fill="url(#cardB)"/>
    <text class="h" x="24" y="42" font-size="20">Carpeta de marcadores</text>
    <text class="row" x="24" y="66" font-size="13" opacity="0.9">(barra de marcadores)</text>
    <g transform="translate(24,86)">
      <rect width="252" height="34" rx="8" fill="#ffffff" fill-opacity="0.20"/>
      <path d="M14 12 h12 l4 4 h12 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-25 a3 3 0 0 1 -3 -3 z" fill="#FFFBEB"/>
      <text class="row" x="56" y="22" font-size="14">Trabajo</text>
    </g>
    <g transform="translate(48,128)">
      <rect width="228" height="30" rx="8" fill="#ffffff" fill-opacity="0.16"/>
      <path d="M12 10 h10 l3 3 h10 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-20 a3 3 0 0 1 -3 -3 z" fill="#FFF7ED"/>
      <text class="row" x="46" y="20" font-size="13">Proyectos</text>
    </g>
    <g transform="translate(72,164)">
      <rect width="204" height="26" rx="7" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M14 7 l3 6 h-6 z" fill="#ffffff"/>
      <text class="row" x="34" y="18" font-size="12">pestaña.com</text>
    </g>
    <g transform="translate(48,198)">
      <rect width="228" height="26" rx="7" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M14 7 l3 6 h-6 z" fill="#ffffff"/>
      <text class="row" x="34" y="18" font-size="12">otra-pestaña.com</text>
    </g>
  </g>

  <!-- arrows between -->
  <g transform="translate(360,0)">
    <!-- top: tab -> bookmark -->
    <path d="M8 175 C 110 145, 130 145, 232 175" stroke="#7C3AED" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M232 175 l-19 -4 l8 15 z" fill="#7C3AED"/>
    <rect x="46" y="120" width="150" height="30" rx="15" fill="#EDE9FE" stroke="#7C3AED" stroke-opacity="0.35"/>
    <text class="cap" x="121" y="140" font-size="13" text-anchor="middle">Guardar en Marcadores</text>

    <!-- bottom: bookmark -> tab -->
    <path d="M232 285 C 130 315, 110 315, 8 285" stroke="#D97706" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M8 285 l19 -4 l-8 15 z" fill="#D97706"/>
    <rect x="26" y="300" width="190" height="30" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-opacity="0.35"/>
    <text class="cap2" x="121" y="320" font-size="13" text-anchor="middle">Abrir como carpeta de pestañas</text>
  </g>

  <text class="muted" x="480" y="404" font-size="15" text-anchor="middle">La estructura anidada (subcarpetas + pestañas) se conserva en ambos sentidos</text>
</svg>
